name: introduction_screen
description: Introduction/Onboarding package for flutter app with some customizations possibilities
version: 4.0.0
repository: https://github.com/pyozer/introduction_screen
issue_tracker: https://github.com/pyozer/introduction_screen/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  material_ui: ^1.0.0
  flutter:
    sdk: flutter

  collection: ^1.18.0
  # Fork carrying the standalone-UI migration; the pub release renders an
  # SDK-Material InkWell that throws "No Material widget found." under material_ui.
  dots_indicator:
    git: https://github.com/StrangeTechDev/dots_indicator.git
  flutter_keyboard_visibility_temp_fork: ^0.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
